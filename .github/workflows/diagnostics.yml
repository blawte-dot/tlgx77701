name: Diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Telegram diagnostic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/telegram-diagnostic.mjs

      - name: Commit diagnostic result
        run: |
          git config user.name "crypto-markets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/telegram-diagnostic.json
          git diff --cached --quiet || git commit -m "diagnostics: telegram check [skip ci]"
          git push
